name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 未配置，停止发布"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/juyue-release.jks"
          ls -l "$RUNNER_TEMP/juyue-release.jks"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/^def version = .*/def version = \"$VERSION\"/" app/build.gradle
          grep -n '^def version' app/build.gradle

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/juyue-release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --no-daemon --stacktrace

      - name: Collect APK and checksum
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/app/release/*.apk | head -1)
          cp "$APK" "dist/juyue-android-${VERSION}.apk"
          cd dist
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Verify APK signature
        run: |
          APK=$(ls dist/*.apk | head -1)
          keytool -printcert -jarfile "$APK" | head -8

      - name: Write release notes
        run: |
          {
            echo "## 橘阅 Android ${VERSION}"
            echo
            awk -v tag="v${VERSION}" '
              index($0, "## " tag) == 1 { found = 1; next }
              found && index($0, "## ") == 1 { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "包名：\`com.factorcitrus.juyue.release\`，覆盖安装需与旧包同签名。"
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 橘阅 Android ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
